# GitHub Pages deploy for the defense website.
#
# The repo is a monorepo: website/ holds the Vite app; cinematic/ (the
# asset pipelines), cloudflare/ (the labels Worker) and template/ (the
# plain starter) live alongside it. This workflow builds only website/
# and publishes its dist/ to GitHub Pages.
#
# Triggered on every push to main that touches website/. Manual runs are
# available from the Actions tab (workflow_dispatch).
#
# Setup (one-time, in your fork):
#   - Repo Settings → Pages → Source: "GitHub Actions"
#   - VITE_BASE below must match YOUR repo name so /<repo>/<asset> URLs
#     resolve at https://<user>.github.io/<repo>/.
#   - Settings → Secrets and variables → Actions → Variables:
#     MEDIA_BASE_URL = your public bucket URL (see OPERATIONS.md).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Only rebuild when the website actually changed — pipeline and docs
    # edits don't need to redeploy the static site.
    paths:
      - 'website/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # GitHub Pages project sites live at /<repo>/ — VITE_BASE
          # must match for all built asset URLs to resolve. Trailing
          # slash is required.
          VITE_BASE: /stanford-phd-defense/
          # Cloudflare R2 public-bucket URL for large media (basemaps,
          # video, .vtu sim outputs). Set as a repo variable in
          # Settings → Secrets and variables → Actions → Variables:
          #   Name: MEDIA_BASE_URL
          #   Value: https://pub-<hash>.r2.dev/   (trailing slash required)
          # If unset, resolves to empty string and the website falls
          # back to public/ for everything (current behaviour pre-R2).
          VITE_MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
