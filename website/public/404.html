<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Greenland Supraglacial Lake Drainage Events</title>
    <meta name="robots" content="noindex, nofollow" />
    <script type="text/javascript">
      // GitHub Pages SPA fallback (encoder).
      //
      // GH Pages serves static files only — a direct request to
      // /stanford-phd-defense/chapter1 returns 404 because no
      // chapter1.html exists. GH Pages is configured to serve this
      // 404.html in that case.
      //
      // We rewrite the URL into a query string and redirect to the
      // base path. index.html has a matching decoder snippet that
      // restores the original path before vue-router boots, so the
      // SPA sees /stanford-phd-defense/chapter1 as the entry point.
      //
      // pathSegmentsToKeep = 1 because the project site lives at
      // /<repo-name>/. For a custom domain at the root, set to 0.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>Loading…</body>
</html>
